<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>

    <link rel="stylesheet" href="projects.css">
</head>
<body class="projectsPage">
    <audio id="clicksound">
        <source src="assets/minecraft_click.mp3" type="audio/mpeg">
    </audio>

    <header class="topBar">
        <h1>My Projects</h1>
    </header>

    <main class="projectScroll">
        <div class="projectList" id="projectList">
            <button type="button" class="projectItem selected" data-repo="https://github.com/anaelm1/GamePad-9" data-demo="https://www.youtube.com/shorts/X79tJesAYg4">
                <img src="assets/GamePad9.PNG" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">GamePad 9</span>
                    <span class="projectSub">A 9 key macropad with a custom PCB and custom 3D printed body.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/diamond.png" alt="Hardware" class="typeIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/Slab-Clock" data-demo="/demo.html">
                <img src="assets/slabclock.PNG" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">Slab Clock</span>
                    <span class="projectSub">A 4 key alaram clock with a screen to display time and a buzzer for alarms. It also has a custom PCB and 3D printed body.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/diamond.png" alt="Hardware" class="typeIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/MiniPod" data-demo="/demo.html">
                <img src="assets/minipod.png" alt="Picture" class="projectThumb" >
                <span class="projectDetails">
                    <span class="projectName">MiniPod</span>
                    <span class="projectSub">A simple MP3 player which functions using the Arduino Nano, and even has an OLED Display. It also has a custom PCB and 3D printed body.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/diamond.png" alt="Hardware" class="typeIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/3-Inch-Quadcopter" data-demo="/demo.html">
                <img src="assets/drone.png" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">3 Inch Quadcopter</span>
                    <span class="projectSub">ESP32C3 drone built with a custom PCB and a custom 3D-printed body.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/diamond.png" alt="Hardware" class="typeIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/Flight-Simulator-with-computer-vision" data-demo="https://github.com/anaelm1/Flight-Simulator-with-computer-vision/releases/tag/V1.0">
                <img src="" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">SkyNav 3D: FPV Drone Simulator</span>
                    <span class="projectSub">A 3D First Person Drone Simulator built in Python using the Ursina Engine with physics engine.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/emerald.png" alt="Software" class="emeraldIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/A-level-Math-Calculator" data-demo="https://a-level-math-calculator.vercel.app/">
                <img src="" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">A level Math Calculator</span>
                    <span class="projectSub">A Scientific Calculator for A level maths questions, organized by specific topics and question type.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/emerald.png" alt="Software" class="emeraldIcon">
                </span>
            </button>

            <button type="button" class="projectItem" data-repo="https://github.com/anaelm1/WikiGame" data-demo="https://wiki-game-phi.vercel.app/login">
                <img src="" alt="Picture" class="projectThumb">
                <span class="projectDetails">
                    <span class="projectName">WikiGame</span>
                    <span class="projectSub">An online game in which you are given a random Wikipedia start page and must reach a designated target page using only the hyperlinks present within the articles.</span>
                </span>
                <span class="projectTypeIcon">
                    <img src="assets/emerald.png" alt="Software" class="emeraldIcon">
                </span>
            </button>

        </div>
    </main>

    <footer class="bottomBar">
        <div class="projecttype">
            <div class="projectTypeEach">
                <img class="icon" src="assets/diamond.png">
                <span class="textProjectType textDiamond">= Hardware</span>
            </div>
            <div class="projectTypeEach">
                <img class="icon iconEmerald" src="assets/emerald.png">                
                <span class="textProjectType textEmerald">= Software</span>
            </div>               
        </div>
        
        <div class="btnGrid">
            <button id="repoBtn" class="UpperButtons">Open Repo</button>
            <a href="about.html" class="UpperButtons">Contact Me</a>
            <button id="demoBtn" class="UpperButtons">Demo</button>
            <a href="index.html" class="UpperButtons">Cancel</a>
        </div>
    </footer>

    <script src="projects.js"></script>
</body>
</html>
