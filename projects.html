<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="projectsPage">
    <audio id="clicksound">
        <source src="assets/minecraft_click.mp3" type="audio/mpeg">
    </audio>

    <header class="topBar">
        <h1>My Projects</h1>
    </header>

    <main class="worldScroll">
        <div class="worldList" id="worldList">
            <button type="button" class="worldItem selected" data-repo="https://github.com/anaelm1/GamePad-9" data-demo="https://www.youtube.com/shorts/X79tJesAYg4">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">GamePad 9</span>
                    <span class="worldSub">A 9 key macropad with a custom PCB and custom 3D printed body.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/Slab-Clock">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">Slab Clock</span>
                    <span class="worldSub">A 4 key alaram clock with a screen to display time and a buzzer for alarms. It also has a custom PCB and 3D printed body.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/MiniPod">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">MiniPod</span>
                    <span class="worldSub">A simple MP3 player which functions using the Arduino Nano, and even has an OLED Display. It also has a custom PCB and 3D printed body.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/3-Inch-Quadcopter">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">3 Inch Quadcopter</span>
                    <span class="worldSub">ESP32C3 drone built with a custom PCB and a custom 3D-printed body.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/Flight-Simulator-with-computer-vision">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">SkyNav 3D: FPV Drone Simulator</span>
                    <span class="worldSub">A 3D First Person Drone Simulator built in Python using the Ursina Engine with physics engine.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/A-level-Math-Calculator">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">A level Math Calculator</span>
                    <span class="worldSub">A Scientific Calculator for A level maths questions, organized by specific topics and question type.</span>
                </span>
            </button>

            <button type="button" class="worldItem" data-repo="https://github.com/anaelm1/WikiGame">
                <img src="" alt="Picture" class="worldThumb">
                <span class="worldDetails">
                    <span class="worldName">WikiGame</span>
                    <span class="worldSub">An online game in which you are given a random Wikipedia start page and must reach a designated target page using only the hyperlinks present within the articles.</span>
                </span>
            </button>

        </div>
    </main>

    <footer class="bottomBar">
        <div class="btnGrid">
            <button id="repoBtn" class="UpperButtons">Open Repo</button>
            <a href="#contact" class="UpperButtons">Create New Projet?</a>
            <button id="demoBtn" class="UpperButtons">Demo</button>
            <a href="index.html" class="UpperButtons">Cancel</a>
        </div>
    </footer>

    <script src="projects.js"></script>
</body>
</html>
